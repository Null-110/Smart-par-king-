<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Parking - Tayo Theme</title>

  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Compatibility Libraries (v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- TensorFlow.js & Teachable Machine Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <style>
    :root {
      --tayo-blue: #0072CE;
      --tayo-blue-dark: #00509E;
      --rogi-green: #4CAF50;
      --rogi-green-dark: #388E3C;
      --lani-yellow: #FBC02D;
      --gani-red: #E53935;
      --gani-red-dark: #C62828;
      
      --bg-color: #EBF4F6;
      --card-bg: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #7F8C8D;
      --border-radius: 20px;
      --box-shadow: 0 8px 24px rgba(0, 114, 206, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--tayo-blue), var(--tayo-blue-dark));
      color: white;
      padding: 20px 24px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-title i {
      font-size: 2.5rem;
      color: var(--lani-yellow);
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 50%;
    }

    .header-title h1 {
      font-family: 'Fredoka', cursive;
      font-size: 2rem;
    }

    .status-badges {
      display: flex;
      gap: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--rogi-green);
    }

    .pulse-dot.offline { background-color: var(--gani-red); }

    /* STATS CARD */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      padding: 18px;
      border-radius: var(--border-radius);
      text-align: center;
      box-shadow: var(--box-shadow);
    }

    .stat-number {
      font-family: 'Fredoka', cursive;
      font-size: 2.2rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* DASHBOARD GRID SYSTEM PERBAIKAN OVERLAP */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
      align-items: start;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--box-shadow);
      width: 100%;
      position: relative;
      overflow: hidden; /* MEMASTIKAN TIDAK ADA ELEMEN MENIMPA KELUAR KARTU */
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #ECEFF1;
    }

    .card-header h2 {
      font-family: 'Fredoka', cursive;
      font-size: 1.2
